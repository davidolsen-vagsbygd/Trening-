  const dn=['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'][TODAY.getDay()];
  const dots=WEEK.map((w,i)=>{
    if(i===ti) return `<div style="width:34px;height:34px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;">${w.day.slice(0,1)}</div>`;
    if(i<ti) return `<div style="width:34px;height:34px;border-radius:50%;background:var(--bg2);color:var(--text3);display:flex;align-items:center;justify-content:center;font-size:11px;">${w.day.slice(0,1)}</div>`;
    return `<div style="width:34px;height:34px;border-radius:50%;border:0.5px solid var(--border);color:var(--text2);display:flex;align-items:center;justify-content:center;font-size:11px;">${w.day.slice(0,1)}</div>`;
  }).join('');
  document.getElementById('s-hjem').innerHTML=`
    <div class="top"><h1>Recomp</h1><p>Frem til 20. juni · ${dn}</p></div>
    <div class="s2">
      <div class="sbox"><div class="sv">${DAYS_LEFT}</div><div class="sl">dager igjen</div></div>
      <div class="sbox"><div class="sv">${prog}%</div><div class="sl">av planen</div></div>
    </div>
    <div class="pw" style="margin-bottom:16px;"><div class="pb" style="width:${prog}%;background:var(--purple);"></div></div>
    <div class="slbl">I dag</div>
    <div class="card" style="border-color:var(--purple);border-width:1px;">
      <div style="font-weight:600;margin-bottom:${tp.extra?'4px':'10px'}">${tp.label}</div>
      ${tp.extra?`<div style="font-size:12px;color:var(--text2);margin-bottom:10px;">${tp.extra}</div>`:''}
      <div style="display:flex;justify-content:space-between;">${dots}</div>
    </div>
    <div class="slbl">Mål frem til 20. juni</div>
    <div class="card">
      <div class="row"><span>Fett tapt (estimat)</span><span class="tag tt">~1,5 kg</span></div>
      <div class="row"><span>Underskudd per dag</span><span class="tag tc">−450 kcal</span></div>
      <div class="row"><span>Protein per dag</span><span class="tag tp">210 g</span></div>
      <div class="row"><span>Treninger igjen</span><span class="tag ta">~${Math.round(DAYS_LEFT*5/7)} økter</span></div>
    </div>
    <div class="slbl">Vaner i dag</div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;"><span style="color:var(--text2);">Huket av</span><span style="font-weight:500;">${done} / ${CHECKS.length}</span></div>
      <div class="pw"><div class="pb" style="width:${pc(done,CHECKS.length)}%;background:var(--teal);"></div></div>
    </div>
  `;
}

function getDayCats(i){
  const lbl=WEEK[i].label;
  if(lbl.includes('Full')) return ['Full kropp'];
  if(lbl.includes('Push')) return ['Push'];
  if(lbl.includes('Pull')) return ['Pull'];
  if(lbl.includes('Bein')) return ['Bein'];
  if(lbl.includes('Armer')) return ['Skuldre','Armer'];
  if(lbl.includes('Cardio')) return ['Cardio'];
  return [];
}

function exHTML(cats, extra){
  if(cats.length===0) return `<div class="card" style="text-align:center;padding:20px;color:var(--text2);">Hviledag — restitusjon er en del av treningen.</div>`;
  let h='';
  cats.forEach(cat=>{
    h+=`<div class="slbl">${cat}</div>`;
    (LIFTS[cat]||[]).forEach(e=>{
      h+=`<div class="ec">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">
          <span class="en">${e.name}</span>
          <span class="tag ${e.tag}">${e.oneRM?e.oneRM+'kg 1RM':'Estimert'}</span>
        </div>
        <div class="enote">${e.note}</div>
        <div class="sg">${e.sets.map(s=>`<div class="sb"><div class="skg">${s.kg}</div><div class="sd">${s.lbl}</div></div>`).join('')}</div>
      </div>`;
    });
  });
  if(extra&&extra.includes('Mage')){
    h+=`<div class="slbl">Mage — 10 min</div>`;
    (LIFTS['Mage']||[]).forEach(e=>{
      h+=`<div class="ec">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">
          <span class="en">${e.name}</span><span class="tag tb">Mage</span>
        </div>
        <div class="enote">${e.note}</div>
        <div class="sg">${e.sets.map(s=>`<div class="sb"><div class="skg">${s.kg}</div><div class="sd">${s.lbl}</div></div>`).join('')}</div>
      </div>`;
    });
  }
  if(extra&&extra.includes('Cardio')){
    h+=`<div class="slbl">Cardio — 25 min</div>
    <div class="card">
      <div class="row"><span>Type</span><span class="tag tb">Sone 2</span></div>
      <div class="row"><span>Puls</span><span style="font-size:13px;color:var(--text2);">120–140 bpm</span></div>
      <div class="row"><span>Varighet</span><span style="font-size:13px;color:var(--text2);">25 minutter</span></div>
    </div>`;
  }
  return h;
}

function showDay(i){
  document.querySelectorAll('#daypills .pill').forEach((p,idx)=>p.classList.toggle('active',idx===i));
  document.getElementById('dayex').innerHTML=exHTML(getDayCats(i),WEEK[i].extra);
}

function renderTrening(){
  const ti=(TODAY.getDay()+6)%7;
  const tp=WEEK[ti];
  const dots=WEEK.map((w,i)=>{
    if(i===ti) return `<div style="width:34px;height:34px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;">${w.day.slice(0,1)}</div>`;
    if(i<ti)   return `<div style="width:34px;height:34px;border-radius:50%;background:var(--bg2);color:var(--text3);display:flex;align-items:center;justify-content:center;font-size:11px;">${w.day.slice(0,1)}</div>`;
    return `<div style="width:34px;height:34px;border-radius:50%;border:0.5px solid var(--border);color:var(--text2);display:flex;align-items:center;justify-content:center;font-size:11px;">${w.day.slice(0,1)}</div>`;
  }).join('');
  const pills=WEEK.map((w,i)=>`<button class="pill ${i===ti?'active':''}" onclick="showDay(${i})">${w.day}</button>`).join('');
  document.getElementById('s-trening').innerHTML=`
    <div class="top"><h1>Trening</h1><p>${tp.label}${tp.extra?' · '+tp.extra:''}</p></div>
    <div style="display:flex;justify-content:space-between;margin-bottom:12px;">${dots}</div>
    <div class="pills" id="daypills">${pills}</div>
    <div id="dayex">${exHTML(getDayCats(ti),tp.extra)}</div>
  `;
}

function renderMat(){
  const d=MEALS[mealDay];
  const tot=d.pro*4+d.karbo*4+d.fett*9;
  document.getElementById('s-mat').innerHTML=`
    <div class="top"><h1>Mat</h1><p>−450 kcal under vedlikehold</p></div>
    <div class="pills">
      <button class="pill ${mealDay==='trening'?'active':''}" onclick="switchMeal('trening')">Treningsdag</button>
      <button class="pill ${mealDay==='hvile'?'active':''}" onclick="switchMeal('hvile')">Hviledag</button>
    </div>
    <div class="card" style="border-color:var(--coral);border-width:1px;margin-bottom:14px;">
      <div style="font-size:24px;font-weight:600;margin-bottom:10px;">${d.kcal.toLocaleString('nb-NO')} kcal</div>
      <div class="mr"><span class="ml">Protein</span><div class="pw" style="flex:1;"><div class="pb" style="width:${pc(d.pro*4,tot)}%;background:var(--purple);"></div></div><span class="mv">${d.pro}g · ${pc(d.pro*4,tot)}%</span></div>
      <div class="mr"><span class="ml">Karbohydrater</span><div class="pw" style="flex:1;"><div class="pb" style="width:${pc(d.karbo*4,tot)}%;background:var(--teal);"></div></div><span class="mv">${d.karbo}g · ${pc(d.karbo*4,tot)}%</span></div>
      <div class="mr" style="margin-bottom:0;"><span class="ml">Fett</span><div class="pw" style="flex:1;"><div class="pb" style="width:${pc(d.fett*9,tot)}%;background:var(--coral);"></div></div><span class="mv">${d.fett}g · ${pc(d.fett*9,tot)}%</span></div>
    </div>
    ${d.meals.map(m=>`
      <div class="mcard">
        <div class="mlbl">${m.m}</div>
        ${m.items.map(([n,v])=>`<div class="row"><span>${n}</span><span style="color:var(--text2);font-size:12px;text-align:right;flex-shrink:0;">${v}</span></div>`).join('')}
      </div>`).join('')}
  `;
}

function switchMeal(day){mealDay=day;renderMat();}

function renderSjekk(){
  const done=checks.length;
  document.getElementById('s-sjekk').innerHTML=`
    <div class="top"><h1>Daglig sjekk</h1><p>Nullstill hver morgen</p></div>
    <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;">
      <span style="color:var(--text2);">Fremgang i dag</span>
      <span style="font-weight:500;">${done} / ${CHECKS.length}</span>
    </div>
    <div class="pw" style="margin-bottom:16px;"><div class="pb" style="width:${pc(done,CHECKS.length)}%;background:var(--teal);"></div></div>
    <div class="card">
      ${CHECKS.map(c=>`
        <div class="cr ${checks.includes(c.id)?'done':''}" onclick="toggleCheck('${c.id}')">
          <div class="cb">
            ${checks.includes(c.id)?'<svg width="13" height="13" viewBox="0 0 13 13"><polyline points="2,7 5,10 11,3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}
          </div>
          <span class="clbl" style="font-size:14px;">${c.text}</span>
        </div>`).join('')}
    </div>
    <button onclick="resetChecks()" style="width:100%;margin-top:4px;padding:12px;font-size:14px;background:none;border:0.5px solid var(--border2);border-radius:var(--r);color:var(--text2);cursor:pointer;">Nullstill dagens vaner</button>
  `;
}

function toggleCheck(id){
  checks.includes(id)?checks=checks.filter(c=>c!==id):checks.push(id);
  save();renderSjekk();renderHjem();
}
function resetChecks(){checks=[];save();renderSjekk();renderHjem();}

function render(id){
  if(id==='hjem')renderHjem();
  if(id==='trening')renderTrening();
  if(id==='mat')renderMat();
  if(id==='sjekk')renderSjekk();
}
renderHjem();
</script>
</body>
</html>
